apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: enterprise-app
  namespace: argocd
  # Opcional: Asegura que Argo CD borre los recursos si la app es eliminada
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/omajimenal/aws-devsecops.git'
    targetRevision: HEAD
    path: k8s/helm
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: production
  syncPolicy:
    automated:
      prune: true     # Borra recursos en Kubernetes si se eliminan del Helm Chart
      selfHeal: true  # Si alguien altera el recurso manualmente en EKS, Argo CD lo corrige al estado de Git
    syncOptions:
      - CreateNamespace=true # Crea automáticamente el namespace 'production' si no existe