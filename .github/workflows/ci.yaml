name: DevSecOps CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Permisos mínimos necesarios para OIDC (AWS) y subir reportes SARIF / firmar con Cosign
permissions:
  id-token: write
  contents: read
  security-events: write

env:
  AWS_REGION: us-east-1                  # Cambia por tu región de AWS
  ECR_REPOSITORY: enterprise-app         # Cambia por el nombre de tu repositorio ECR
  ROLE_TO_ASSUME: arn:aws:iam::349788921948:role/github-actions-ci-role # Tu ARN del rol IAM con OIDC

jobs:
  build-scan-and-push:
    name: Build, Security Scan & Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # ========================================================================
      # 1. SAST: Análisis Estático de Seguridad en Código (Gosec)
      # ========================================================================
      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec.sarif ./...'

      # ========================================================================
      # 2. Build de la Imagen Local
      # ========================================================================
      - name: Build Local Image for Scanning
        run: |
          docker build -t enterprise-app:local .

      # ========================================================================
      # 3. Vulnerability Scanning: Escaneo de Contenedor (Trivy)
      # ========================================================================
      - name: Run Trivy Vulnerability Scanner on Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'enterprise-app:local'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # ========================================================================
      # 4. Upload SARIF (Gosec)
      # ========================================================================
      - name: Upload SARIF report to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        if: always()
        with:
          sarif_file: 'gosec.sarif'

      # ========================================================================
      # 5. Autenticación OIDC con AWS (Solo en rama main)
      # ========================================================================
      - name: Configure AWS Credentials (OIDC)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ========================================================================
      # 6. Re-tag & Push a Amazon ECR
      # ========================================================================
      - name: Build, Tag and Push Image to ECR
        if: github.ref == 'refs/heads/main'
        id: push-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Etiquetar con Git SHA y latest
          docker tag enterprise-app:local $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag enterprise-app:local $ECR_REGISTRY/$ECR_REPOSITORY:latest

          # Subir imágenes
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          # Exportar el digest exacto para Cosign
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG)
          echo "IMAGE_DIGEST=$DIGEST" >> $GITHUB_ENV

      # ========================================================================
      # 7. Instalación y Firma con Cosign (Keyless Sigstore)
      # ========================================================================
      - name: Install Cosign
        if: github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3.8.0

      - name: Sign Image with Cosign
        if: github.ref == 'refs/heads/main'
        run: |
          cosign sign --yes "${{ env.IMAGE_DIGEST }}"