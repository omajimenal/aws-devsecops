name: DevSecOps CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-scan:
    name: Build & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # ========================================================================
      # 1. SAST: Análisis Estático de Seguridad en Código (Gosec)
      # ========================================================================
      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec.sarif ./...'

      # ========================================================================
      # 2. Build de la Imagen Local
      # ========================================================================
      - name: Build Local Image for Scanning
        run: |
          docker build -t enterprise-app:local .

      # ========================================================================
      # 3. Vulnerability Scanning: Escaneo de Contenedor (Trivy)
      # ========================================================================
      - name: Run Trivy Vulnerability Scanner on Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'enterprise-app:local'
          format: 'table'
          exit-code: '1' # Rompe el build si encuentra vulnerabilidades graves
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # ========================================================================
      # 4. Upload SARIF (Opcional - Resultados visibles en la pestaña Security)
      # ========================================================================
      - name: Upload SARIF report to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'gosec.sarif'